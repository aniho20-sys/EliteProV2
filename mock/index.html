<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>ElitePro screen renderer</title>
  </head>
  <body>
    <script>
      // ThemeProvider reads this on mount; setting the attribute alone is overwritten.
      try { localStorage.setItem('elitepro_theme', 'dark'); } catch {}
      document.documentElement.setAttribute('data-theme', 'dark');
    </script>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
