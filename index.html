<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4361ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512-v3.png" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ElitePro" />
    <link rel="apple-touch-icon" href="/icon-192-v3.png" />

    <!-- iOS splash screens (portrait) -->
    <!-- iPhone 15 Pro Max / 14 Pro Max (1290×2796 @3x → 430×932pt) -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1290x2796.png" />
    <!-- iPhone 15 Pro / 14 Pro (1179×2556 @3x → 393×852pt) -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1179x2556.png" />
    <!-- iPhone 15 / 14 / 13 / 12 (1170×2532 @3x → 390×844pt) -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1170x2532.png" />
    <!-- iPhone 11 / XR (828×1792 @2x → 414×896pt) -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-828x1792.png" />
    <!-- iPhone SE 3rd gen / 8 / 7 (750×1334 @2x → 375×667pt) -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-750x1334.png" />
    <!-- iPad Pro 12.9" (2048×2732 @2x) -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-2048x2732.png" />

    <!-- Open Graph / social preview.
         og:image MUST be an absolute URL — WhatsApp, Facebook and iMessage all discard a
         relative path and fall back to a bare link. Update the host here (and og:url) if
         the site moves to a custom domain. HashRouter keeps every route behind '#', which
         crawlers never send to the server, so this one static set covers the whole site. -->
    <meta property="og:site_name" content="ElitePro" />
    <meta property="og:title" content="Run your coaching from one app instead of six." />
    <meta property="og:description" content="Plans, bookings, session credits and payments for independent personal trainers. No setup fee, no commission. First 5 coaches get 3 months free." />
    <meta property="og:image" content="https://elitepro-16718.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ElitePro — run your coaching from one app instead of six." />
    <meta property="og:url" content="https://elitepro-16718.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter/X reads its own namespace and ignores og: for card type -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Run your coaching from one app instead of six." />
    <meta name="twitter:description" content="Plans, bookings, session credits and payments for independent personal trainers. No setup fee, no commission." />
    <meta name="twitter:image" content="https://elitepro-16718.web.app/og-image.png" />

    <meta name="description" content="ElitePro is an app for independent personal trainers: build plans, book sessions, track session credits and take payments. No setup fee and no commission." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>ElitePro - Fitness Training Platform</title>
  </head>
  <body>
    <script>
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('elitepro_theme') || 'light');
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
