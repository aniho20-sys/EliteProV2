name: Deploy to Firebase

on:
  push:
    branches: ['claude/fitness-app-features-LbxtG']
  workflow_dispatch:

# One deploy at a time. Two pushes a minute apart on 2026-09-23 started two runs that
# both planned to CREATE the three new Phase 3 functions. Whichever lost the race then
# retried "create" against a function that already existed, every ~100s, for 40
# minutes, until cancelled by hand — and the rules job, which waits on functions, never
# ran. Queuing (not cancelling) matters: cancelling a deploy mid-flight is exactly the
# half-finished state this avoids. The later run simply starts when the earlier ends.
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing deploys unless every suite passes. Until 2026-09-27 this workflow built and
  # deployed with no tests at all: ~470 tests existed but only ran when an agent remembered
  # to run them by hand, and on 2026-09-27 a commit went live with a failing frontend guard
  # (authMessages.test.js) because only the functions and rules suites had been run.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            firestore-tests/package-lock.json

      # The Firestore emulator is a Java program.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          (cd functions && npm ci)
          (cd firestore-tests && npm ci)

      # Errors fail the build; warnings do not. `npm run build` cannot catch an undefined
      # variable (CLAUDE.md #45) — eslint is the check that does.
      - name: Lint
        run: npx eslint .

      - name: Frontend tests
        run: npx vitest run

      # Emulator only — never the real project (CLAUDE.md #38). The --project value just
      # names the emulator's namespace; no credentials are written in this job.
      - name: Cloud Functions + Firestore rules tests (emulator)
        run: >-
          npx firebase-tools@latest emulators:exec --only firestore --project elitepro-16718
          "cd functions && npx jest --testPathPattern=test/ --forceExit && cd ../firestore-tests && npx jest --testPathPattern=. --forceExit"

  deploy_hosting:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: Write Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy Hosting
        run: npx firebase-tools@latest deploy --only hosting --project elitepro-16718 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

  deploy_rules:
    runs-on: ubuntu-latest
    # Rules deploy AFTER functions, deliberately.
    #
    # These three jobs used to run in parallel, which is fine while rules only ever loosen.
    # It stops being fine the moment a rule closes a door that a Cloud Function is meant to
    # reopen: rules deploy in seconds, functions take minutes, so for the gap between them
    # the door is shut and nothing is behind it. That is what tightening `users` on
    # 2026-08-27 would have done — invite codes unresolvable for every new student until the
    # functions job caught up, which is the 2026-08-04 outage again (CLAUDE.md #34).
    #
    # Cost of this ordering: a failed functions deploy now also blocks the rules deploy.
    # That is the safer failure — the rules already in production keep matching the
    # functions already in production.
    needs: deploy_functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy Firestore Rules
        run: npx firebase-tools@latest deploy --only firestore:rules --project elitepro-16718 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

  deploy_functions:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Functions dependencies
        run: cd functions && npm ci

      - name: Write Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy Functions
        run: npx firebase-tools@13 deploy --only functions --project elitepro-16718 --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
