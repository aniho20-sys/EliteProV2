name: Deploy to Firebase

on:
  push:
    branches: ['claude/fitness-app-features-LbxtG']
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: Write Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy Hosting
        run: npx firebase-tools@latest deploy --only hosting --project elitepro-16718 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      - name: Deploy Firestore Rules
        run: npx firebase-tools@latest deploy --only firestore:rules --project elitepro-16718 --non-interactive
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      - name: Install Functions dependencies
        run: cd functions && npm ci

      - name: Deploy Functions
        id: deploy_functions
        run: npx firebase-tools@13 deploy --only functions --project elitepro-16718 --non-interactive
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      - name: Report Functions deploy result
        if: steps.deploy_functions.outcome == 'failure'
        run: |
          echo "::error::Functions deployment FAILED. Check the Deploy Functions step above for the exact error."
          exit 1
